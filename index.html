<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <title>Suda</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 18% 15%, rgba(255,255,255,.18), transparent 28%),
        radial-gradient(circle at 82% 80%, rgba(120,90,255,.25), transparent 32%),
        linear-gradient(135deg, #09090c, #15151b 55%, #0b0b10);
    }
    body::before {
      content: "";
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: rgba(145,120,255,.18);
      filter: blur(90px);
      top: -120px;
      right: -80px;
    }
    .glass {
      position: relative;
      width: min(88%, 720px);
      padding: 72px 42px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 36px;
      background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.055));
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.18), 0 30px 100px rgba(0,0,0,.5);
    }
    .glass::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(115deg, rgba(255,255,255,.13), transparent 35%, transparent 65%, rgba(255,255,255,.05));
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 18px;
      font-size: clamp(58px, 12vw, 110px);
      line-height: .9;
      letter-spacing: -6px;
      font-weight: 700;
      text-shadow: 0 8px 35px rgba(0,0,0,.28);
    }
    p {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(17px, 3vw, 22px);
      color: rgba(255,255,255,.72);
      letter-spacing: -.2px;
    }
    @media (max-width: 520px) {
      .glass { padding: 58px 24px; border-radius: 30px; }
      h1 { letter-spacing: -4px; }
    }
  </style>
</head>
<body>
  <main class="glass">
    <h1>Suda</h1>
    <p>галерея</p>
  </main>
</body>
</html>
